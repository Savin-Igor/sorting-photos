services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Commands
    SortingPhotosByDate\Command\:
        resource: '../src/Command/*'
        tags: ['console.command']
        public: true

    # Application Handlers
    SortingPhotosByDate\Application\Handler\:
        resource: '../src/Application/Handler/*'

    # Adapters
    SortingPhotosByDate\Adapters\:
        resource: '../src/Adapters/*'

    # Infrastructure
    SortingPhotosByDate\Infrastructure\:
        resource: '../src/Infrastructure/*'

    # Event Handlers
    SortingPhotosByDate\Infrastructure\Messenger\:
        resource: '../src/Infrastructure/Messenger/*'
        tags: ['messenger.message_handler']
    
    # FileProcessedHandler needs destinationBasePath
    SortingPhotosByDate\Infrastructure\Messenger\FileProcessedHandler:
        arguments:
            $destinationBasePath: '%app.destination_directory%'

    # ============================================
    # Logger Configuration
    # ============================================
    
    # Monolog Logger (only console handler to avoid file permission issues)
    Monolog\Logger:
        arguments:
            $name: 'file-sorter'
            $handlers:
                - '@monolog.handler.console'
                # File handler disabled temporarily to avoid permission issues
                # - '@monolog.handler.file'
    
    monolog.handler.console:
        class: Monolog\Handler\StreamHandler
        arguments:
            $stream: 'php://stdout'
            $level: !php/const Monolog\Logger::INFO
    
    monolog.handler.file:
        class: Monolog\Handler\StreamHandler
        arguments:
            $stream: '%kernel.project_dir%/var/log/app.log'
            $level: !php/const Monolog\Logger::DEBUG
    
    # Bind LoggerPort interface to MonologAdapter
    SortingPhotosByDate\Ports\LoggerPort:
        alias: SortingPhotosByDate\Adapters\Logger\MonologAdapter
        public: true
    
    SortingPhotosByDate\Adapters\Logger\MonologAdapter:
        arguments:
            $logger: '@Monolog\Logger'

    # ============================================
    # Scanner Configuration
    # ============================================
    
    # Symfony Finder
    Symfony\Component\Finder\Finder:
        factory: ['Symfony\Component\Finder\Finder', 'create']
    
    # Bind ScannerPort interface to SymfonyFinderAdapter
    SortingPhotosByDate\Ports\ScannerPort:
        alias: SortingPhotosByDate\Adapters\Scanner\SymfonyFinderAdapter
        public: true
    
    SortingPhotosByDate\Adapters\Scanner\SymfonyFinderAdapter:
        arguments:
            $finder: '@Symfony\Component\Finder\Finder'

    # ============================================
    # Metadata Extractor Chain Configuration
    # ============================================
    
    # Chain of extractors (tries ExifAdapter, GetId3Adapter, then GenericAdapter)
    SortingPhotosByDate\Infrastructure\Metadata\MetadataExtractorChain:
        arguments:
            $extractors:
                - '@SortingPhotosByDate\Adapters\Metadata\ExifAdapter'
                - '@SortingPhotosByDate\Adapters\Metadata\GetId3Adapter'
                - '@SortingPhotosByDate\Adapters\Metadata\GenericAdapter'
            $mimeTypeDetector: '@SortingPhotosByDate\Ports\MimeTypeDetectorInterface'
    
    # Bind MetadataExtractorPort interface to chain
    SortingPhotosByDate\Ports\MetadataExtractorPort:
        alias: SortingPhotosByDate\Infrastructure\Metadata\MetadataExtractorChain

    # ============================================
    # Organizer Policy Configuration
    # ============================================
    
    # Policy factory based on configuration
    SortingPhotosByDate\Domain\Policies\DateTypePolicy:
        arguments:
            $baseDirectory: '%app.destination_directory%'
    
    SortingPhotosByDate\Domain\Policies\DatePolicy:
        arguments:
            $baseDirectory: '%app.destination_directory%'
    
    SortingPhotosByDate\Domain\Policies\TypeDatePolicy:
        arguments:
            $baseDirectory: '%app.destination_directory%'
    
    # Select policy based on configuration (default: DateTypePolicy)
    SortingPhotosByDate\Domain\Policies\OrganizerPolicy:
        alias: SortingPhotosByDate\Domain\Policies\DateTypePolicy
        # Override in index.php based on ORGANIZER_POLICY env var

    # ============================================
    # Repository Configuration
    # ============================================
    
    # Doctrine DBAL Connection
    Doctrine\DBAL\Connection:
        factory: ['Doctrine\DBAL\DriverManager', 'getConnection']
        arguments:
            - 
                driver: 'pdo_sqlite'
                path: '%kernel.project_dir%/var/database.sqlite'
    
    # Database Metadata Repository
    SortingPhotosByDate\Adapters\Repository\DatabaseMetadataRepository:
        arguments:
            $connection: '@Doctrine\DBAL\Connection'
        calls:
            - ['initializeSchema', []]
    
    # Bind MetadataRepositoryPort interface to implementation
    SortingPhotosByDate\Ports\MetadataRepositoryPort:
        alias: SortingPhotosByDate\Adapters\Repository\DatabaseMetadataRepository

    # ============================================
    # Messenger Configuration
    # ============================================
    
    # Temporary placeholder for MessageBusInterface (will be replaced after compilation)
    # This is needed to satisfy autowiring during container compilation
    Symfony\Component\Messenger\MessageBusInterface:
        class: SortingPhotosByDate\Infrastructure\Messenger\SynchronousMessageBus
        public: false
        arguments:
            $container: '@service_container'
        # This will be replaced with actual instance after compilation in ContainerFactory::setupMessageBus()

