framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                # Use Doctrine (SQLite) for local development
                # For production, use Redis or RabbitMQ:
                # dsn: '%env(REDIS_URL)%'
                # dsn: 'amqp://guest:guest@localhost:5672/%2f/messages'
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: '%env(int:MESSENGER_MAX_RETRIES)%'
                    delay: '%env(int:MESSENGER_RETRY_DELAY)%'
                    multiplier: '%env(float:MESSENGER_RETRY_MULTIPLIER)%'
                    max_delay: '%env(int:MESSENGER_RETRY_MAX_DELAY)%'
                    service: null

            failed:
                # Failed messages go here (Dead Letter Queue)
                dsn: 'doctrine://default?queue_name=failed'

        routing:
            # Route domain events to async transport
            SortingPhotosByDate\Domain\Event\FileDiscovered: async
            SortingPhotosByDate\Domain\Event\FileProcessed: async
            SortingPhotosByDate\Domain\Event\FileOrganized: async
            SortingPhotosByDate\Domain\Event\FileError: async

            # Route commands to async transport
            SortingPhotosByDate\Application\Command\IngestFileCommand: async
            SortingPhotosByDate\Application\Command\OrganizeFileCommand: async

