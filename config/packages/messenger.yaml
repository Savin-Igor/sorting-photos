framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                # Use Doctrine (SQLite) for local development
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0

            failed:
                # Failed messages go here
                dsn: 'doctrine://default?queue_name=failed'

        routing:
            # Route events to async transport
            SortingPhotosByDate\Event\FileDiscovered: async
            SortingPhotosByDate\Event\FileProcessed: async
            SortingPhotosByDate\Event\FileOrganized: async
            SortingPhotosByDate\Event\FileError: async

            # Route commands to async transport
            SortingPhotosByDate\Application\Command\IngestFileCommand: async
            SortingPhotosByDate\Application\Command\OrganizeFileCommand: async

