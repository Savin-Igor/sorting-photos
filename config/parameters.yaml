parameters:
    # Application parameters (from environment variables)
    # These will be set from environment variables in index.php if not already set
    app.source_directory: ''
    app.destination_directory: ''
    app.source_directory_host: ''
    app.destination_directory_host: ''
    app.organizer_policy: 'date-type'
    app.dry_run: false
    
    # Filesystem parameters
    app.filesystem.default_dir_permissions: 493  # 0755 in decimal
    
    # Google Photos API parameters
    app.google_photos.access_token: ''
    app.google_photos.album_id: null
    app.google_photos.credentials_path: ''
    app.google_photos.full_access: false
    
    # Compression parameters
    app.compression.enabled: false
    app.compression.jpeg_max_pixels: 75000000  # 75 MP (Google Photos limit)
    app.compression.png_max_pixels: 200000000  # 200 MP (Google Photos limit)
    app.compression.video_max_size_bytes: 10737418240  # 10 GB (Google Photos limit)


